name: cred_vault
description: "CredVault - a zero-knowledge password vault built with Flutter and Firebase."

publish_to: 'none' 

version: 2.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  firebase_core: ^4.2.0
  provider: ^6.1.5+1
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3
  flutter_animate: ^4.5.2
  font_awesome_flutter: ^11.0.0
  cryptography: ^2.9.0
  http: ^1.6.0
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:

  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

# Launcher icons are generated from assets/images (see tool/generate_logo.py):
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/launcher_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "assets/images/launcher_background.png"
  adaptive_icon_foreground: "assets/images/launcher_foreground.png"
  windows:
    generate: true
    image_path: "assets/images/launcher_icon.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/images/launcher_icon.png"
    background_color: "#0F0F1E"
    theme_color: "#101E44"
